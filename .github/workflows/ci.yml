name: CI

on:
  push:
  pull_request:

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke run on the fabricated demo
        run: python -m complaint_to_eval demo --out out/demo
      - name: Taxonomy invariants
        run: python -m complaint_to_eval taxonomy
      - name: Defect taxonomy invariants
        run: python -m complaint_to_eval defect-taxonomy
      - name: Defects smoke run on the fixture
        run: python -m complaint_to_eval defects --input tests/fixtures/defect_input.jsonl --synthetic --out out/defects-smoke
      - name: Label template structure
        run: python -m complaint_to_eval validate --labels eval/labels.template.jsonl
      - name: Privacy scan over shipped data files
        run: python -m complaint_to_eval privacy --path .
